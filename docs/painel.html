<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cobrança — painel</title>
<style>
  :root{--bg:#f6f7f9;--fg:#111;--card:#fff;--bd:#e3e5e9;--mut:#666}
  @media(prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e9eaec;--card:#1c1f24;--bd:#2a2e35;--mut:#9aa0a8}}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
  .caixa{max-width:640px;margin:14vh auto;padding:0 18px;text-align:center}
  .erro{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;text-align:left;overflow-wrap:anywhere}
  .mut{color:var(--mut);font-size:13.5px}
  form{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-top:8px;text-align:left}
  input{width:100%;box-sizing:border-box;font:15px system-ui;padding:11px 12px;margin:10px 0;
        border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
  button{font:600 15px system-ui;padding:11px 18px;border-radius:8px;border:0;background:#0b5;color:#fff;cursor:pointer}
  #recado{color:#c0392b}
</style>
</head>
<body>
<div class="caixa" id="caixa">
  <p id="carregando">Carregando o painel da cobrança…</p>
  <p class="mut">A tela vem da função; este endereço é só a casca.</p>

  <form id="pedeChave" hidden>
    <p id="motivo"><b>Cole a chave de acesso do painel.</b></p>
    <p class="mut">Ela fica guardada neste navegador; na próxima vez o painel abre direto.</p>
    <input id="chave" type="password" autocomplete="off" spellcheck="false"
           placeholder="chave de acesso" aria-label="chave de acesso">
    <button type="submit">Abrir painel</button>
    <p class="mut" id="recado"></p>
  </form>
</div>
<!--
  A CASCA DO PAINEL. Existe por uma regra da plataforma, nao por gosto: o dominio supabase.co
  nao entrega pagina para o navegador. Medido nesta ordem, em 24/09:

    Edge Function devolvendo text/html           -> chega como text/plain + nosniff
    Storage (bucket publico, mimetype text/html) -> chega como text/plain + nosniff
    application/xhtml+xml e text/xml             -> chegam como text/plain + nosniff
    image/svg+xml                                -> passa (unico que passa, e inutil aqui: o
                                                    gateway ainda manda `content-security-policy:
                                                    default-src 'none'; sandbox`, que mata o
                                                    script dos botoes)

  Por isso a tela mora aqui, no GitHub Pages, que serve HTML de verdade, e busca o conteudo da
  funcao. Se um dia o Supabase passar a servir HTML, esta casca pode ser jogada fora e o link
  volta a ser o da funcao.

  TRES CICATRIZES, todas descobertas com o botao morto na mao do gestor:

  1. SEM VARIAVEL GLOBAL AQUI. Depois do document.write a tela da producao roda no MESMO objeto
     global desta casca, e ela declara `const API`. Enquanto esta casca tambem declarava um
     `API` global, o navegador recusava o script inteiro da tela com "Identifier API has
     already been declared": a tela aparecia inteira e TODOS os botoes ficavam mortos. Por isso
     tudo aqui vive dentro de uma funcao anonima.

  2. ESTE COMENTARIO PRECISA FECHAR. Em 07/10 o botao voltou a morrer e a causa estava aqui: o
     fechamento do comentario havia desaparecido numa edicao, junto com a abertura do corpo e a
     tag de abertura do bloco de codigo. O navegador engolia o JS inteiro como comentario e a
     pagina nao fazia nada.

  3. NADA DE SINAL DE HTML NESTA PROSA. A primeira tentativa de conserto, no mesmo dia, trouxe
     o bug de volta: o texto explicando a cicatriz 2 CITAVA o fechamento do comentario, e o
     navegador fechou o comentario ali mesmo — o resto da prosa virou codigo e o console
     acusou "script is not defined". Comentario de HTML nao tem escape: quem explicar isso aqui
     escreve "fechamento do comentario" com palavras, nunca com os caracteres.

  O document.write e de proposito: a tela da producao traz o proprio bloco de codigo, e codigo
  inserido por innerHTML nao executa — o botao ficaria morto de novo, por outro caminho.

  CONFERIR ANTES DE PUBLICAR: `node testes/casca.teste.mjs` (checa comentario, bloco de codigo
  e a caixa de carregamento) e, quando mexer no fluxo, o teste de navegador do scratchpad.
-->
<script>
(function () {
  var ENDERECO = "https://bwbeieumxcuomtrvlqxs.supabase.co/functions/v1/cobranca-painel";

  var caixa = document.getElementById("caixa");
  var form = document.getElementById("pedeChave");
  var campo = document.getElementById("chave");
  var recado = document.getElementById("recado");
  var carregando = document.getElementById("carregando");
  var q = new URLSearchParams(location.search);

  // A chave vive no navegador de quem usa, nunca neste arquivo (o repositorio e publico) e
  // nunca na barra de enderecos depois da primeira vez: quem colar aqui abre o painel pelo
  // endereco limpo nas proximas vezes, e link encaminhado por engano nao leva a chave junto.
  function guardada() { try { return localStorage.getItem("painel_k") || ""; } catch (e) { return ""; } }
  function guardar(k) { try { localStorage.setItem("painel_k", k); } catch (e) { /* aba privada */ } }
  function esquecer() { try { localStorage.removeItem("painel_k"); } catch (e) { /* idem */ } }

  function pedirChave(msg) {
    if (carregando) carregando.hidden = true;
    form.hidden = false;
    recado.textContent = msg || "";
    campo.focus();
  }

  function erro(texto) {
    caixa.innerHTML = '<p class="erro"><b>Não consegui abrir o painel.</b><br>' +
      String(texto).replace(/[<>&]/g, "") + '</p>' +
      '<p class="mut">O motor continua rodando — o que falhou foi só a tela.</p>';
  }

  function carregar(chave) {
    if (!chave) return pedirChave();
    var p = new URLSearchParams(location.search);
    p.set("k", chave);
    fetch(ENDERECO + "?" + p.toString(), { headers: { accept: "text/html" }, cache: "no-store" })
      .then(function (r) {
        return r.text().then(function (t) {
          // 401 = chave errada ou vencida: esquece a guardada e pede de novo, em vez de
          // deixar a pessoa presa num erro que ela nao sabe como resolver
          if (r.status === 401) { esquecer(); pedirChave("Essa chave não foi aceita. Confira com quem cuida da cobrança."); return null; }
          if (!r.ok) throw new Error("a função respondeu " + r.status + ": " + t.slice(0, 200));
          return t;
        });
      })
      .then(function (html) {
        if (html === null) return;
        if (html.charAt(0) !== "<") throw new Error("resposta inesperada: " + html.slice(0, 200));
        guardar(chave);
        // document.write de proposito: a tela da producao traz o proprio bloco de codigo, e
        // codigo inserido por innerHTML nao executa — o botao ficaria morto.
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function (e) { erro(e.message || e); });
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var k = (campo.value || "").trim();
    if (!k) return;
    recado.textContent = "";
    form.hidden = true;
    if (carregando) { carregando.hidden = false; carregando.textContent = "Abrindo o painel…"; }
    carregar(k);
  });

  carregar(q.get("k") || guardada());
})();
</script>
</body></html>
